## Docker Compose v2 — Sungold SPH302480A read-only Modbus → MQTT sidecar
services:
  sungold_modbus_ro:
    build:
      context: ./sungold
      dockerfile: Dockerfile
    image: sungold_modbus_ro:local
    container_name: sungold_modbus_ro
    restart: unless-stopped
    labels:
      autoheal: "true"
    env_file:
      - ./.env
    environment:
      - MODBUS_DEVICE=/dev/sungold
      - MODBUS_ADDRESS=${MODBUS_ADDRESS:-1}
      - MODBUS_BAUDRATE=${MODBUS_BAUDRATE:-9600}
      - MQTT_TOPIC=${MQTT_TOPIC:-sungold_sph302480a}
      - DEVICE_NAME=${DEVICE_NAME:-Sungold SPH302480A}
      - POLL_INTERVAL_SEC=${POLL_INTERVAL_SEC:-5}
      - HEARTBEAT_FILE=/tmp/sungold_modbus_ro.heartbeat
    devices:
      - "${SUNGOLD_SERIAL_DEVICE:-/dev/sungold}:/dev/sungold"
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,sys,time; p=os.environ.get('HEARTBEAT_FILE','/tmp/sungold_modbus_ro.heartbeat'); max_age=4*float(os.environ.get('POLL_INTERVAL_SEC') or 5)+60; m=os.path.getmtime(p) if os.path.exists(p) else 0; sys.exit(0 if time.time()-m<=max_age else 1)\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

# Usage (after USB cable + udev rule):
#   set ENABLE_SUNGOLD=1 and SUNGOLD_SERIAL_DEVICE in .env
#   docker compose -f docker-compose.sungold.yml up -d --build
