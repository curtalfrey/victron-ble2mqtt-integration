# Raspberry Pi 4 — Theengs BLE gateway → Mosquitto on .105.
#
# Solar-site BLE (Govee at the Victron gear) is heard here. House BLE is Pi 5.
# Env names match Docker Hub (MQTT_PUB_TOPIC, TIME_BETWEEN, SCAN_TIME).
# https://hub.docker.com/r/theengs/gateway

name: pi4-theengs

services:
  theengs-gateway:
    image: theengs/gateway:v1.7.5.1
    container_name: pi4-theengs-gateway
    restart: unless-stopped
    network_mode: host
    privileged: true
    env_file:
      - mqtt.env
    environment:
      MQTT_PUB_TOPIC: home/TheengsGateway-pi4/BTtoMQTT
      MQTT_SUB_TOPIC: home/+/BTtoMQTT/undecoded
      MQTT_PRE_TOPIC: home/presence/TheengsGateway-pi4
      LWT_TOPIC: home/TheengsGateway-pi4/LWT
      PUBLISH_ALL: "false"
      TIME_BETWEEN: "45"
      SCAN_TIME: "5"
      LOG_LEVEL: WARNING
      DISCOVERY: "true"
      HASS_DISCOVERY: "true"
      PRESENCE: "false"
      DISCOVERY_TOPIC: homeassistant
      DISCOVERY_DEVICE_NAME: TheengsGateway-pi4
      DISCOVERY_FILTER: "[IBEACON,GAEN,MS-CDP,APPLE_CONT,APPLE_CONTAT]"
      # H5075 needs active scan (https://www.home-assistant.io/integrations/govee_ble/).
      # Short scan / long gap so victron_ble2mqtt still gets Instant Readout on hci0.
      SCANNING_MODE: active
      ADAPTER: hci0
    volumes:
      - /var/run/dbus:/var/run/dbus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
