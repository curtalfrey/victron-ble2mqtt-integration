[dependency-groups]
# PEP 735 — local dev: pip install --group dev  (requires pip ≥24.1)
dev = [
  "pytest>=9",
  "ruff>=0.9",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
exclude = [
  "^/swarm/",
  "^/overrides/",
  "^/venv/",
  "^/.venv/",
]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["victron_ble2mqtt", "override", "tests"]
known_first_party = ["victron_ble2mqtt"]
skip = ["swarm", "overrides", ".venv", "venv"]

[tool.ruff]
line-length = 100
target-version = "py39"
# Runtime code lives under override/ — lint it in CI (see .github/workflows/ci.yml).
extend-exclude = ["swarm", "overrides", "venv", ".venv"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "B",  # flake8-bugbear
  "I",  # isort import order
  "UP", # pyupgrade
  "PL", # pylint-like rules
]
ignore = [
  "E203",  # whitespace before ':' (black compatible)
  "E501",  # line length (let black handle wrapping)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
